<!doctype html>

<html lang="ko">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>선물 정보 확인·수정</title>


  <link
    rel="stylesheet"
    href="../css/global.css"
  />


  <link
    rel="stylesheet"
    href="../css/present-confirm.css"
  />

</head>


<body>

  <main
    class="mobile-shell present-confirm-page"
  >


    <header
      class="app-header confirm-header"
    >

      <button
        class="back-btn"
        id="backBtn"
        type="button"
        aria-label="이전 페이지로 이동"
      >
        ‹
      </button>


      <h1>
        선물 정보 확인·수정
      </h1>

    </header>


    <section class="confirm-scroll">


      <div class="step-section">

        <div class="step-list">

          <span class="step-item">
            유형 선택
          </span>

          <span class="step-item">
            기본 정보
          </span>

          <span class="step-item">
            상세 정보
          </span>

          <span class="step-item">
            메모
          </span>

          <span class="step-item active">
            최종 확인
          </span>

        </div>

      </div>


      <section class="intro-section">

        <h2>
          선물 정보 확인
        </h2>

        <p>
          아래 정보를 확인하고 필요한 내용을 수정해 주세요.
        </p>

      </section>


      <!-- =========================
           Basic
      ========================== -->

      <section class="form-section">

        <h3>
          선물 기본 정보
        </h3>


        <div class="info-card">


          <div class="gift-image-area">

            <img
              id="giftImage"
              class="gift-image"
              src=""
              alt="선물 이미지"
              hidden
            />


            <div
              class="image-placeholder"
              id="imagePlaceholder"
            >

              <span>
                선물 이미지
              </span>

            </div>

          </div>


          <div class="input-group">

            <label for="productName">
              상품명
            </label>

            <input
              id="productName"
              type="text"
              placeholder="상품명을 입력해주세요"
            />

          </div>


          <div class="input-group">

            <label for="productPrice">
              가격 (원)
            </label>

            <input
              id="productPrice"
              type="text"
              inputmode="numeric"
              placeholder="가격을 입력해주세요"
            />

          </div>


          <div class="input-group">

            <label for="productBrand">
              구매처 또는 브랜드
            </label>

            <input
              id="productBrand"
              type="text"
              placeholder="구매처 또는 브랜드를 입력해주세요"
            />

          </div>

        </div>

      </section>


      <!-- =========================
           Friend
      ========================== -->

      <section class="form-section">

        <h3>
          저장할 친구 지정
        </h3>


        <div class="friend-card">

          <p class="friend-question">
            누구를 위한 선물인가요?
          </p>


          <div
            class="friend-list"
            id="friendList"
          >

            <button
              class="friend-chip active"
              type="button"
              data-friend="지수"
            >
              지수
            </button>


            <button
              class="friend-chip"
              type="button"
              data-friend="민준"
            >
              민준
            </button>


            <button
              class="friend-chip"
              type="button"
              data-friend="하은"
            >
              하은
            </button>


            <button
              class="friend-chip"
              type="button"
              data-friend="다른 친구"
            >
              다른 친구
            </button>

          </div>


          <button
            class="add-friend-btn"
            id="addFriendBtn"
            type="button"
          >
            친구 추가
          </button>

        </div>

      </section>


      <!-- =========================
           Memo
      ========================== -->

      <section
        class="form-section memo-section"
      >

        <h3>
          메모
          <span>
            (선택 사항)
          </span>
        </h3>


        <div class="memo-card">

          <p class="memo-example">
            예: 블랙 컬러 좋아함, 가죽 소재 선호
          </p>


          <textarea
            id="memoInput"
            maxlength="200"
            placeholder="선물과 관련된 메모를 입력해주세요"
          ></textarea>


          <div class="memo-count">
            <span id="memoCount">
              0
            </span>/200
          </div>

        </div>

      </section>


      <button
        class="save-btn"
        id="saveBtn"
        type="button"
      >
        선물 후보 저장
      </button>

    </section>


    <div
      class="toast"
      id="toast"
      role="status"
      aria-live="polite"
    ></div>

  </main>


  <script
    src="../js/present-confirm.js"
  ></script>

</body>

</html>
