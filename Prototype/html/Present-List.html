<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>후보 목록</title>

  <link
    rel="stylesheet"
    href="../css/global.css"
  />

  <link
    rel="stylesheet"
    href="../css/Present-List.css"
  />
</head>

<body>

  <main class="mobile-shell">

    <header class="app-header">
      <h1>후보 목록</h1>
    </header>


    <section class="page-scroll">

      <!-- =========================
           Hero
      ========================== -->

      <div class="hero-row">

        <div class="hero-copy">

          <h2>
            너를 위한 선물함
          </h2>

          <p id="candidateCount">
            후보 0개
          </p>

        </div>


        <button
          class="primary-btn"
          id="addBtn"
          type="button"
        >
          후보 추가
        </button>

      </div>


      <!-- =========================
           Filter
      ========================== -->

      <div class="filters">

        <div class="field">

          <label for="friendFilter">
            친구
          </label>

          <div class="select-wrap">

            <select id="friendFilter">
              <option value="all">
                전체
              </option>

              <option value="지수">
                지수
              </option>

              <option value="민준">
                민준
              </option>

              <option value="하은">
                하은
              </option>
            </select>

          </div>

        </div>


        <div class="field">

          <label for="sortFilter">
            정렬
          </label>

          <div class="select-wrap">

            <select id="sortFilter">

              <option value="latest">
                최신순
              </option>

              <option value="oldest">
                오래된순
              </option>

              <option value="priceHigh">
                가격 높은순
              </option>

              <option value="priceLow">
                가격 낮은순
              </option>

            </select>

          </div>

        </div>

      </div>


      <!-- =========================
           Tournament
      ========================== -->

      <div class="tournament-bar">

        <h3>
          토너먼트 후보 선택
        </h3>

        <button
          class="tournament-btn"
          id="tournamentBtn"
          type="button"
        >
          토너먼트 시작
        </button>

      </div>


      <!-- =========================
           Candidate List
      ========================== -->

      <div
        class="candidate-list"
        id="candidateList"
      ></div>

    </section>


    <!-- =========================
         Tab Bar
    ========================== -->

    <nav
      class="tabbar"
      aria-label="하단 메뉴"
    >

      <button
        class="tab-item"
        type="button"
      >
        <span class="tab-icon">
          ⌂
        </span>

        <span>
          홈
        </span>
      </button>


      <button
        class="tab-item active"
        type="button"
      >
        <span class="tab-icon">
          ♡
        </span>

        <span>
          위시리스트
        </span>
      </button>


      <button
        class="tab-item"
        type="button"
      >
        <span class="tab-icon">
          ♙
        </span>

        <span>
          커뮤니티
        </span>
      </button>

    </nav>


    <div
      class="toast"
      id="toast"
    ></div>

  </main>


  <script src="../js/Present-List.js"></script>

</body>
</html>
