<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>후보 상세</title>

  <!-- 공통 CSS -->
  <link
    rel="stylesheet"
    href="../css/global.css"
  />

  <!-- 페이지 전용 CSS -->
  <link
    rel="stylesheet"
    href="../css/present-detail.css"
  />
</head>

<body>

  <main class="mobile-shell present-detail-page">

    <!-- =========================
         Header
    ========================== -->
    <header class="detail-header">

      <button
        class="back-button"
        type="button"
        aria-label="뒤로가기"
        id="backBtn"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M15 18L9 12L15 6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <h1 class="detail-header-title">
        후보 상세
      </h1>

      <div class="header-spacer"></div>

    </header>


    <!-- =========================
         Scroll Content
    ========================== -->
    <div class="detail-scroll">

      <!-- 상품 이미지 -->
      <section class="product-image-section">

        <div class="product-image-box" id="productImageBox">

          <!-- 실제 이미지가 있으면 JS에서 img 생성 -->
          <img
  id="presentImage"
  class="detail-image"
  src=""
  alt="선물 이미지"
  hidden
/>

<div
  id="imagePlaceholder"
  class="image-placeholder"
>
  이미지
</div>

        </div>

      </section>


      <!-- =========================
           기본 정보
      ========================== -->
      <section class="detail-card product-info-card">

        <div class="product-title-row">

          <h2
            class="product-name"
            id="productName"
          >
            버즈 라이트 이어폰 프로
          </h2>

          <span
            class="source-badge"
            id="sourceBadge"
          >
            AI 제안
          </span>

        </div>


        <div class="product-meta-grid">

          <div class="meta-item">

            <span class="meta-label">
              가격
            </span>

            <strong
              class="meta-value price"
              id="productPrice"
            >
              68,000원
            </strong>

          </div>


          <div class="meta-item">

            <span class="meta-label">
              저장일
            </span>

            <span
              class="meta-value"
              id="savedDate"
            >
              2025.05.18
            </span>

          </div>

        </div>


        <div class="card-divider"></div>


        <div class="relationship-info">

          <div class="info-row">

            <span class="info-label">
              선물 대상
            </span>

            <span
              class="outline-chip"
              id="recipient"
            >
              지수
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              관계
            </span>

            <span
              class="outline-chip"
              id="relationship"
            >
              친구
            </span>

          </div>

        </div>

      </section>


      <!-- =========================
           관심 근거
      ========================== -->
      <section class="detail-card reason-card">

        <h2 class="section-title">
          관심 근거
        </h2>


        <div
          class="reason-chip-list"
          id="reasonList"
        >

          <span class="outline-chip reason-chip">
            직접 갖고 싶다고 했어요
          </span>

          <span class="outline-chip reason-chip">
            요즘 자주 쓰는 것 같아요
          </span>

        </div>


        <div class="card-divider reason-divider"></div>


        <div class="memo-area">

          <h3 class="memo-title">
            자유 메모
          </h3>

          <p
            class="memo-text"
            id="memoText"
          >
            생일 선물로 고려 중. 작년에 이어폰 잃어버렸다고 했음.
          </p>

        </div>

      </section>


      <!-- =========================
           안내
      ========================== -->
      <p class="detail-notice">
        저장 당시 기준 정보로, 현재 가격·재고와 다를 수 있어요.
      </p>


      <!-- =========================
           Actions
      ========================== -->
      <div class="detail-actions">

        <button
          type="button"
          class="primary-button"
          id="editButton"
        >
          편집하기
        </button>

        <button
          type="button"
          class="delete-button"
          id="deleteButton"
        >
          삭제
        </button>

      </div>

    </div>


    <!-- =========================
         Delete Modal
    ========================== -->
    <div
      class="modal-backdrop"
      id="deleteModal"
      aria-hidden="true"
    >

      <div
        class="delete-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="deleteModalTitle"
      >

        <h2
          class="modal-title"
          id="deleteModalTitle"
        >
          후보를 삭제할까요?
        </h2>

        <p class="modal-description">
          삭제한 후보는 다시 복구할 수 없어요.
        </p>

        <div class="modal-actions">

          <button
            type="button"
            class="modal-button cancel"
            id="cancelDeleteButton"
          >
            취소
          </button>

          <button
            type="button"
            class="modal-button delete"
            id="confirmDeleteButton"
          >
            삭제
          </button>

        </div>

      </div>

    </div>

  </main>


  <script src="../js/present-detail.js"></script>

</body>
</html>
