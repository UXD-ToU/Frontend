<div class="friend-detail-page page-container">

  <div class="page-top">
    <button class="icon-btn" type="button" data-page="friends" aria-label="뒤로가기">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <section class="friend-profile">
    <div id="detail-avatar" class="btn-avatar btn-avatar--pale btn-avatar--lg" aria-hidden="true">
      <span class="btn-avatar__holes"><i></i><i></i><i></i><i></i></span>
    </div>

    <h1 class="friend-profile__name" id="detail-name"></h1>
    <p class="friend-profile__birthday" id="detail-birthday"></p>

    <ul class="tag-list" id="detail-tags"></ul>
  </section>

  <div class="bottom-action bottom-action--split">
    <button class="text-action" type="button" data-page="friend-add" data-edit="true">정보 수정</button>
    <button class="text-action text-action--strong" type="button" id="delete-friend">친구 삭제</button>
  </div>

</div>
