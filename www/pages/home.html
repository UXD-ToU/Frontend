<div class="home-page">

  <!-- 생일 D-day -->
  <section class="birthday-hero">
    <div class="birthday-calendar" aria-hidden="true">
      <div class="birthday-calendar__rings"><i></i><i></i><i></i></div>
      <span class="birthday-calendar__label">생일</span>
      <span class="birthday-calendar__date" id="hero-date">--/--</span>
    </div>

    <div class="birthday-info">
      <h2 class="birthday-title" id="hero-title"></h2>
      <button class="birthday-cta" type="button" id="hero-cta" data-page="wishlist-detail">선물 후보 보러가기 →</button>
    </div>
  </section>

  <!-- 선물 후보 등록 -->
  <section class="home-section">
    <h3 class="home-section-title">선물 후보 등록하기</h3>

    <div class="register-list">
      <button class="register-card register-card--photo" type="button" data-page="wish-add">
        <span class="register-card__desc">사진을 골라 선물 후보로 저장해요.</span>
        <span class="register-card__title">사진으로 등록 <img src="./assets/icons/camera.svg" alt=""></span>
      </button>

      <button class="register-card register-card--link" type="button" data-page="wish-link">
        <span class="register-card__desc">상품 링크와 정보를 직접 입력해 저장해요.</span>
        <span class="register-card__title">링크로 등록 <img src="./assets/icons/link.svg" alt=""></span>
      </button>
    </div>
  </section>

  <!-- 다가오는 생일 -->
  <section class="home-section">
    <h3 class="home-section-title">다가오는 생일</h3>
    <div class="upcoming-list" id="upcoming-list"></div>
  </section>

  <footer style="padding:24px 32px"><a href="#privacy" data-page="privacy" style="text-decoration:underline">개인정보처리방침</a></footer>
</div>
